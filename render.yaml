services:
  - type: web
    name: chance-to-alert-odesa
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt telethon
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: TELEGRAM_STRING_SESSION
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
